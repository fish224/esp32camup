<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-CAM 文件浏览器</title>
  <style>
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    
    .file-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .file-preview img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
    }
    
    .file-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .btn-view, .btn-download, .btn-delete {
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-view { background: #4CAF50; color: white; }
    .btn-download { background: #2196F3; color: white; }
    .btn-delete { background: #f44336; color: white; }
    
    .btn-delete:hover {
      background: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESP32-CAM 文件浏览器</h1>
    
    <div class="controls">
      <input type="text" id="searchInput" placeholder="搜索文件名...">
      <button onclick="loadFiles()">刷新</button>
    </div>
    
    <div class="file-grid" id="fileGrid">
      <!-- 文件项将通过JavaScript动态生成 -->
    </div>
  </div>
  
  <script>
    // 认证令牌变量
    let AUTH_TOKEN = '';
    
    // 页面加载时检查认证
    document.addEventListener('DOMContentLoaded', function() {
      AUTH_TOKEN = localStorage.getItem('esp32cam_auth_token');
      if (!AUTH_TOKEN) {
        showLoginModal();
      } else {
        loadFiles();
      }
    });
    
    // 加载文件列表
    async function loadFiles() {
      try {
        const response = await fetch('/api/browse', {
          headers: {
            'Authorization': `Bearer ${AUTH_TOKEN}`
          }
        });
        
        if (response.ok) {
          const files = await response.json();
          renderFiles(files);
        } else if (response.status === 401) {
          // 未授权，显示登录界面
          showLoginModal();
        }
      } catch (error) {
        console.error('加载文件失败:', error);
      }
    }
    
    // 渲染文件列表
    function renderFiles(files) {
      const fileGrid = document.getElementById('fileGrid');
      fileGrid.innerHTML = '';
      
      files.forEach(file => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.dataset.filename = file.name;
        
        fileItem.innerHTML = `
          <div class="file-preview">
            <img src="/api/file/${encodeURIComponent(file.name)}?thumb=true" 
                 alt="${file.name}" 
                 onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"200\"><rect width=\"100%\" height=\"100%\" fill=\"%23f0f0f0\"/><text x=\"50%\" y=\"50%\" font-family=\"Arial\" font-size=\"14\" fill=\"%23999\" text-anchor=\"middle\" dy=\".3em\">${file.name}</text></svg>'">
          </div>
          <div class="file-info">
            <div class="file-name">${file.name}</div>
            <div class="file-meta">
              <span class="file-size">${(file.size / 1024 / 1024).toFixed(2)} MB</span>
              <span class="file-date">${new Date(file.uploaded).toLocaleString()}</span>
            </div>
            <div class="file-actions">
              <button class="btn-view" onclick="viewFile('${file.name.replace(/'/g, "\\'")}')">
                查看
              </button>
              <button class="btn-download" onclick="downloadFile('${file.name.replace(/'/g, "\\'")}')">
                下载
              </button>
              <button class="btn-delete" onclick="deleteFile('${file.name.replace(/'/g, "\\'")}')">
                删除
              </button>
            </div>
          </div>
        `;
        
        fileGrid.appendChild(fileItem);
      });
    }
    
    // 删除文件函数
    async function deleteFile(fileName) {
      if (!confirm(`确定要删除文件 "${fileName}" 吗？此操作不可撤销。`)) {
        return;
      }
      
      try {
        const response = await fetch(`/api/delete/${encodeURIComponent(fileName)}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${AUTH_TOKEN}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          const result = await response.json();
          alert(result.message || '文件删除成功');
          
          // 从DOM中移除文件项
          const fileItem = document.querySelector(`[data-filename="${fileName}"]`);
          if (fileItem) {
            fileItem.remove();
          }
        } else {
          const error = await response.json();
          alert(`删除失败: ${error.error || '未知错误'}`);
        }
      } catch (error) {
        console.error('删除文件时出错:', error);
        alert('删除文件时发生网络错误');
      }
    }
    
    // 其他辅助函数...
    function viewFile(fileName) {
      window.open(`/api/file/${encodeURIComponent(fileName)}`, '_blank');
    }
    
    function downloadFile(fileName) {
      window.location.href = `/api/file/${encodeURIComponent(fileName)}?download=true`;
    }
  </script>
</body>
</html>
