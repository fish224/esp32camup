<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <!-- 样式表和其他头部信息 -->
</head>
<body>
<div id="gallery"></div>

<script>
  // 渲染图片项
  function renderGallery(files) {
    const galleryEl = document.getElementById('gallery');
    galleryEl.innerHTML = files.map(file => `
      <div class="img-item">
        <img 
          src="https://r2.yuxinyu.dpdns.org/${encodeURIComponent(file.name)}" 
          alt="${file.name}" 
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/160x120?text=加载失败';"
          style="width:160px; height:120px; object-fit:cover; border:1px solid #ddd;"
        />
        <div title="${file.uploaded}">${file.name}</div>
        <button onclick="deleteImage('${file.name}')">删除</button>
        <button onclick="downloadImage('${file.name}')">下载</button>
      </div>
    `).join('');
  }

  async function deleteImage(filename) {
    const token = localStorage.getItem('authToken');
    if (!token) {
      alert('请先登录');
      return;
    }
    const response = await fetch(`/delete/${filename}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (response.ok) {
      alert('删除成功');
      // 刷新页面或更新UI以反映更改
    } else {
      alert('删除失败');
    }
  }

  async function downloadImage(filename) {
    const token = localStorage.getItem('authToken');
    if (!token) {
      alert('请先登录');
      return;
    }
    const url = `/download/${encodeURIComponent(filename)}`;
    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.ok) {
      const blob = await res.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    } else {
      alert('下载失败');
    }
  }
  
  // 示例：假设您有一个获取文件列表的方法
  window.onload = () => {
    // 此处应替换为实际获取文件列表的逻辑
    const files = [{name: 'example.jpg', uploaded: new Date()}];
    renderGallery(files);
  };
</script>
</body>
</html>
