<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 相机图库</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      margin: 0 auto;
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(7, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1340px;
      margin: 0 auto;
      overflow-x: auto;
    }

    .img-item {
      text-align: center;
      position: relative;
    }

    img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: transform 0.2s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    .filename {
      margin: 5px 0;
      font-size: 11px;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-result {
      font-size: 11px;
      margin-top: 4px;
      padding: 4px;
      border-radius: 3px;
      background-color: #f0f0f0;
      display: none; /* 默认隐藏，分析后显示 */
    }

    .analysis-result.unique {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .analysis-result.semantic {
      background-color: #fff8e1;
      color: #ff8f00;
    }

    .analysis-result.exact {
      background-color: #ffebee;
      color: #c62828;
    }

    button {
      margin: 2px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pagination {
      margin: 20px 0;
      text-align: center;
      font-size: 14px;
    }

    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
    }

    #loading {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

<!-- 登录区域 -->
<div id="loginSection" class="login">
  <h2>管理员登录</h2>
  <input type="password" id="password" placeholder="输入密码" />
  <button onclick="login()">登录</button>
  <div id="loginMessage"></div>
</div>

<!-- 图库区域 -->
<div id="gallerySection" class="gallery" style="display:none;">
  <h2>图片库</h2>
  <button onclick="logout()">退出登录</button>
  <div id="gallery"></div>
  <div id="pagination"></div>
</div>

<!-- 全局加载提示 -->
<div id="loading">AI 分析中，请稍候...</div>

<script>
  const R2_PUBLIC_URL = 'https://r2.yuxinyu.dpdns.org';

  // 内存缓存：避免重复请求
  const analysisCache = new Map();

  window.onload = () => {
    const token = localStorage.getItem('authToken');
    if (token) {
      showGallery();
      loadImages(1);
    }
  };

  async function login() {
    const password = document.getElementById('password').value;
    const res = await fetch('/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password })
    });

    const data = await res.json();
    const msgEl = document.getElementById('loginMessage');

    if (data.success) {
      localStorage.setItem('authToken', data.token);
      msgEl.style.color = 'green';
      msgEl.textContent = data.message;
      setTimeout(() => {
        showGallery();
        loadImages(1);
      }, 1000);
    } else {
      msgEl.style.color = 'red';
      msgEl.textContent = data.error;
    }
  }

  function logout() {
    localStorage.removeItem('authToken');
    document.getElementById('gallerySection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
  }

  function showGallery() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('gallerySection').style.display = 'block';
  }

  async function loadImages(page = 1) {
    const token = localStorage.getItem('authToken');
    const url = new URL('/browse', location.origin);
    url.searchParams.set('page', page);
    url.searchParams.set('limit', 28);

    const res = await fetch(url.toString(), {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!res.ok) {
      alert('获取图片列表失败，请重新登录');
      logout();
      return;
    }

    const data = await res.json();
    const { files, pagination } = data;

    renderGallery(files);
    renderPagination(pagination);
  }

  function renderGallery(files) {
    const galleryEl = document.getElementById('gallery');
    galleryEl.innerHTML = files.map(file => `
      <div class="img-item" data-filename="${file.name}">
        <img src="${R2_PUBLIC_URL}/${encodeURIComponent(file.name)}" 
             onerror="this.src='https://via.placeholder.com/160x120?text=加载失败';" />
        <div class="filename">${file.name}</div>
        <button onclick="deleteImage('${file.name}')">删除</button>
        <button onclick="downloadImage('${file.name}')">下载</button>
        <button onclick="checkDuplicate('${file.name}')" id="btn-analyze-${file.name}">查重</button>
        <div class="analysis-result" id="result-${file.name}"></div>
      </div>
    `).join('');
    
    // 恢复已缓存的分析结果
    for (const file of files) {
      const cached = analysisCache.get(file.name);
      if (cached) {
        displayAnalysisResult(file.name, cached);
      }
    }
  }

  function renderPagination(pagination) {
    const paginationEl = document.getElementById('pagination');
    paginationEl.innerHTML = '';

    if (pagination.totalPages <= 1) return;

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '上一页';
    prevBtn.disabled = !pagination.hasPrev;
    prevBtn.onclick = () => loadImages(pagination.currentPage - 1);
    paginationEl.appendChild(prevBtn);

    for (let i = 1; i <= pagination.totalPages; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      if (i === pagination.currentPage) btn.style.backgroundColor = '#e0e0e0';
      btn.onclick = () => loadImages(i);
      paginationEl.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.textContent = '下一页';
    nextBtn.disabled = !pagination.hasNext;
    nextBtn.onclick = () => loadImages(pagination.currentPage + 1);
    paginationEl.appendChild(nextBtn);
  }

  async function deleteImage(filename) {
    if (!confirm(`确定删除 ${filename}？`)) return;

    const token = localStorage.getItem('authToken');
    const res = await fetch(`/delete/${encodeURIComponent(filename)}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.ok) {
      alert('删除成功');
      loadImages(); // 刷新当前页
      analysisCache.delete(filename); // 清除缓存
    } else {
      const err = await res.json().catch(() => ({ error: '未知错误' }));
      alert('删除失败：' + err.error);
    }
  }

  async function downloadImage(filename) {
    const token = localStorage.getItem('authToken');
    const res = await fetch(`/download/${encodeURIComponent(filename)}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.ok) {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    } else {
      alert('下载失败，请重新登录');
    }
  }

  // ========== 查重 & 分析 ==========
  async function checkDuplicate(filename) {
    const token = localStorage.getItem('authToken');
    if (!token) {
      alert('请先登录');
      return;
    }

    // 检查是否已分析
    if (analysisCache.has(filename)) {
      const cached = analysisCache.get(filename);
      displayAnalysisResult(filename, cached);
      return;
    }

    const btn = document.getElementById(`btn-analyze-${filename}`);
    btn.disabled = true;
    const loadingEl = document.getElementById('loading');
    loadingEl.style.display = 'block';

    try {
      const res = await fetch(`/analyze/${encodeURIComponent(filename)}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      loadingEl.style.display = 'none';
      btn.disabled = false;

      if (!res.ok) {
        const errMsg = await res.text().catch(() => '未知错误');
        alert('分析失败：' + errMsg);
        return;
      }

      const result = await res.json();
      analysisCache.set(filename, result); // 缓存到内存
      displayAnalysisResult(filename, result);
    } catch (e) {
      loadingEl.style.display = 'none';
      btn.disabled = false;
      alert('请求失败：' + e.message);
    }
  }

  function displayAnalysisResult(filename, result) {
    const el = document.getElementById(`result-${filename}`);
    if (!el) return;

    let html = '';
    let className = '';

    if (result.result === 'exact_duplicate') {
      className = 'exact';
      const list = result.similarImages.map(i => i.filename).join(', ');
      html = `⚠️ 完全重复<br>相似图: ${list}`;
    } else if (result.result === 'semantic_similar') {
      className = 'semantic';
      const list = result.similarImages.map(i => `${i.filename} (${i.similarity})`).join(', ');
      html = `🔍 语义相似<br>描述: ${result.description}<br>相似图: ${list}`;
    } else {
      className = 'unique';
      html = `✅ 唯一<br>描述: ${result.description}`;
    }

    el.className = `analysis-result ${className}`;
    el.innerHTML = html;
    el.style.display = 'block';
  }
</script>

</body>
</html>
