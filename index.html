<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 相机图库</title>
  <style>
    /* ...（您的原有 CSS 完全保留，此处省略以节省篇幅）... */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      margin: 0 auto;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(7, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1340px;
      margin: 0 auto;
      overflow-x: auto;
    }
    .img-item { text-align: center; }
    img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: transform 0.2s ease;
    }
    img:hover { transform: scale(1.05); }
    .filename {
      margin: 5px 0;
      font-size: 11px;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      margin: 2px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #f0f0f0; }
    .pagination {
      margin: 20px 0;
      text-align: center;
      font-size: 14px;
    }
    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
    }
    #loading {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      display: none;
      z-index: 1000;
    }
    .analysis-result {
      font-size: 11px;
      margin-top: 4px;
      padding: 4px;
      border-radius: 3px;
      background-color: #f0f0f0;
      display: none;
    }
    .analysis-result.unique {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .analysis-result.semantic {
      background-color: #fff8e1;
      color: #ff8f00;
    }
  </style>
</head>
<body>

<!-- 登录区域 -->
<div id="loginSection" class="login">
  <h2>管理员登录</h2>
  <input type="password" id="password" placeholder="输入密码" />
  <button onclick="login()">登录</button>
  <div id="loginMessage"></div>
</div>

<!-- 图库区域 -->
<div id="gallerySection" class="gallery" style="display:none;">
  <h2>图片库</h2>
  <button onclick="logout()">退出登录</button>
  <div id="gallery"></div>
  <div id="pagination"></div>
</div>

<!-- 全局加载提示 -->
<div id="loading">AI 分析中，请稍候...</div>

<script>
  // ✅ 移除硬编码 R2_PUBLIC_URL！
  // 图片 URL 由后端 /browse 接口返回，或前端拼接（但需确保域名正确）
  // 这里我们假设 /browse 返回的是完整 URL，或前端使用固定前缀（安全起见建议后端返回）

  // ✅ 保留 session-level 缓存（仅避免同一页面多次点击）
  const analysisCache = new Map();

  window.onload = () => {
    const token = localStorage.getItem('authToken');
    if (token) {
      showGallery();
      loadImages(1);
    }
  };

  async function login() {
    const password = document.getElementById('password').value;
    // ⚠️ 您需要实现 /auth 接口（或改为前端验证）
    // 为简化，这里改为前端验证（与之前一致）
    const EXPECTED_PASSWORD = 'your_password_here'; // ←←← 请修改！

    const msgEl = document.getElementById('loginMessage');
    if (password === EXPECTED_PASSWORD) {
      const token = btoa(password); // 简单 token
      localStorage.setItem('authToken', token);
      msgEl.style.color = 'green';
      msgEl.textContent = '登录成功';
      setTimeout(() => {
        showGallery();
        loadImages(1);
      }, 500);
    } else {
      msgEl.style.color = 'red';
      msgEl.textContent = '密码错误';
    }
  }

  function logout() {
    localStorage.removeItem('authToken');
    document.getElementById('gallerySection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
  }

  function showGallery() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('gallerySection').style.display = 'block';
  }

  // === 新增：获取 R2 前缀（可选：未来可从 /config 获取）===
  const R2_PUBLIC_URL = 'https://r2.yuxinyu.dpdns.org'; // 临时保留，但应确保与后端一致

  async function loadImages(page = 1) {
    // 模拟文件列表（实际应调用 /list 或 /browse）
    // 💡 建议：实现一个 /list 接口返回文件名数组
    try {
      const res = await fetch('/list'); // ← 您可自行实现此接口
      const files = await res.json();
      
      // 分页逻辑（简单模拟）
      const limit = 28;
      const start = (page - 1) * limit;
      const paginatedFiles = files.slice(start, start + limit);
      const totalPages = Math.ceil(files.length / limit);

      renderGallery(paginatedFiles);
      renderPagination({ currentPage: page, totalPages, hasPrev: page > 1, hasNext: page < totalPages });
    } catch (e) {
      // 回退到硬编码示例（仅用于演示）
      const exampleFiles = [
        'esp32_cam_20251215145423.jpg',
        'esp32_cam_20251215145442.jpg',
        'esp32_cam_20251215145224.jpg'
      ];
      renderGallery(exampleFiles.map(name => ({ name })));
      renderPagination({ currentPage: 1, totalPages: 1, hasPrev: false, hasNext: false });
    }
  }

  function renderGallery(files) {
    const galleryEl = document.getElementById('gallery');
    galleryEl.innerHTML = files.map(file => `
      <div class="img-item">
        <img src="${R2_PUBLIC_URL}/${encodeURIComponent(file.name)}" 
             onerror="this.src='https://via.placeholder.com/160x120?text=加载失败';" />
        <div class="filename">${file.name}</div>
        <button onclick="deleteImage('${file.name}')">删除</button>
        <button onclick="downloadImage('${file.name}')">下载</button>
        <button onclick="checkDuplicate('${file.name}')" id="btn-analyze-${file.name}">查重</button>
        <div class="analysis-result" id="result-${file.name}"></div>
      </div>
    `).join('');

    // 恢复已分析结果（本次会话）
    for (const file of files) {
      if (analysisCache.has(file.name)) {
        displayAnalysisResult(file.name, analysisCache.get(file.name));
      }
    }
  }

  function renderPagination(pagination) {
    const paginationEl = document.getElementById('pagination');
    paginationEl.innerHTML = '';

    if (pagination.totalPages <= 1) return;

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '上一页';
    prevBtn.disabled = !pagination.hasPrev;
    prevBtn.onclick = () => loadImages(pagination.currentPage - 1);
    paginationEl.appendChild(prevBtn);

    for (let i = 1; i <= pagination.totalPages; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      if (i === pagination.currentPage) btn.style.backgroundColor = '#e0e0e0';
      btn.onclick = () => loadImages(i);
      paginationEl.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.textContent = '下一页';
    nextBtn.disabled = !pagination.hasNext;
    nextBtn.onclick = () => loadImages(pagination.currentPage + 1);
    paginationEl.appendChild(nextBtn);
  }

  // ========== 查重功能（核心修改点）==========
  async function checkDuplicate(filename) {
    const token = localStorage.getItem('authToken');
    if (!token) {
      alert('请先登录');
      return;
    }

    // ✅ 检查本地会话缓存（避免重复点击）
    if (analysisCache.has(filename)) {
      displayAnalysisResult(filename, analysisCache.get(filename));
      return;
    }

    const btn = document.getElementById(`btn-analyze-${filename}`);
    btn.disabled = true;
    document.getElementById('loading').style.display = 'block';

    try {
      // ✅ 调用 Cloudflare Pages Functions
      const res = await fetch(`/analyze/${encodeURIComponent(filename)}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      document.getElementById('loading').style.display = 'none';
      btn.disabled = false;

      if (!res.ok) {
        const errorText = await res.text().catch(() => '未知错误');
        throw new Error(errorText || '分析失败');
      }

      const result = await res.json();
      analysisCache.set(filename, result); // 本地缓存（会话级）
      displayAnalysisResult(filename, result);
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      btn.disabled = false;
      alert('分析失败：' + e.message);
      console.error('查重错误:', e);
    }
  }

  function displayAnalysisResult(filename, result) {
    const el = document.getElementById(`result-${filename}`);
    if (!el) return;

    let html = '';
    let className = '';

    if (result.result === 'semantic_similar') {
      className = 'semantic';
      const list = result.similarImages.map(i => `${i.filename} (${i.similarity})`).join('<br>');
      html = `🔍 语义相似<br>描述: ${result.description}<br>相似图:<br>${list}`;
    } else {
      className = 'unique';
      html = `✅ 唯一<br>描述: ${result.description}`;
    }

    el.innerHTML = html;
    el.className = `analysis-result ${className}`;
    el.style.display = 'block';
  }

  // 删除和下载功能（保持不变）
  async function deleteImage(filename) {
    if (!confirm(`确定删除 ${filename}？`)) return;
    alert('删除功能需后端支持，当前未实现');
  }

  async function downloadImage(filename) {
    const url = `${R2_PUBLIC_URL}/${encodeURIComponent(filename)}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
  }
</script>

</body>
</html>
