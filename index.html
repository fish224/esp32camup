<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 相机图库</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      margin: 0 auto;
    }

    /* 设置图库容器最小宽度，确保7列不换行 */
    #gallery {
      display: grid;
      grid-template-columns: repeat(7, minmax(160px, 1fr)); /* 每个网格单元至少160px宽 */
      gap: 20px; /* 列与列、行与行之间的间距 */
      max-width: 1340px; /* 考虑到间距后大约是1260px + 80px的总间隙 */
      margin: 0 auto;
      overflow-x: auto; /* 小屏幕时允许横向滚动 */
    }

    .img-item {
      text-align: center;
    }

    img {
      width: 100%; /* 占满网格单元 */
      height: 120px; /* 固定高度 */
      object-fit: cover;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: transform 0.2s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    .filename {
      margin: 5px 0;
      font-size: 11px;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      margin: 2px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    .pagination {
      margin: 20px 0;
      text-align: center;
      font-size: 14px;
    }

    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>

<!-- 登录区域 -->
<div id="loginSection" class="login">
  <h2>管理员登录</h2>
  <input type="password" id="password" placeholder="输入密码" />
  <button onclick="login()">登录</button>
  <div id="loginMessage"></div>
</div>

<!-- 图库区域 -->
<div id="gallerySection" class="gallery" style="display:none;">
  <h2>图片库</h2>
  <button onclick="logout()">退出登录</button>
  <div id="gallery"></div>
  <div id="pagination"></div>
</div>

<script>
  const R2_PUBLIC_URL = 'https://r2.yuxinyu.dpdns.org';

  window.onload = () => {
    const token = localStorage.getItem('authToken');
    if (token) {
      showGallery();
      loadImages(1); // 加载第一页（28张）
    }
  };

  async function login() {
    const password = document.getElementById('password').value;
    const res = await fetch('/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password })
    });

    const data = await res.json();
    const msgEl = document.getElementById('loginMessage');

    if (data.success) {
      localStorage.setItem('authToken', data.token);
      msgEl.style.color = 'green';
      msgEl.textContent = data.message;
      setTimeout(() => {
        showGallery();
        loadImages(1);
      }, 1000);
    } else {
      msgEl.style.color = 'red';
      msgEl.textContent = data.error;
    }
  }

  function logout() {
    localStorage.removeItem('authToken');
    document.getElementById('gallerySection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
  }

  function showGallery() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('gallerySection').style.display = 'block';
  }

  async function loadImages(page = 1) {
    const token = localStorage.getItem('authToken');
    const url = new URL('/browse', location.origin);
    url.searchParams.set('page', page);
    url.searchParams.set('limit', 28); // 每页28张

    const res = await fetch(url.toString(), {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!res.ok) {
      alert('获取图片列表失败，请重新登录');
      logout();
      return;
    }

    const data = await res.json();
    const { files, pagination } = data;

    renderGallery(files);
    renderPagination(pagination);
  }

  function renderGallery(files) {
    const galleryEl = document.getElementById('gallery');
    galleryEl.innerHTML = files.map(file => `
      <div class="img-item">
        <img src="${R2_PUBLIC_URL}/${encodeURIComponent(file.name)}" 
             onerror="this.src='https://via.placeholder.com/160x120?text=加载失败';" />
        <div class="filename">${file.name}</div>
        <button onclick="deleteImage('${file.name}')">删除</button>
        <button onclick="downloadImage('${file.name}')">下载</button>
      </div>
    `).join('');
  }

  function renderPagination(pagination) {
    const paginationEl = document.getElementById('pagination');
    paginationEl.innerHTML = '';

    if (pagination.totalPages <= 1) return;

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '上一页';
    prevBtn.disabled = !pagination.hasPrev;
    prevBtn.onclick = () => loadImages(pagination.currentPage - 1);
    paginationEl.appendChild(prevBtn);

    for (let i = 1; i <= pagination.totalPages; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      if (i === pagination.currentPage) btn.style.backgroundColor = '#e0e0e0';
      btn.onclick = () => loadImages(i);
      paginationEl.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.textContent = '下一页';
    nextBtn.disabled = !pagination.hasNext;
    nextBtn.onclick = () => loadImages(pagination.currentPage + 1);
    paginationEl.appendChild(nextBtn);
  }

  async function deleteImage(filename) {
    if (!confirm(`确定删除 ${filename}？`)) return;

    const token = localStorage.getItem('authToken');
    const res = await fetch(`/delete/${encodeURIComponent(filename)}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.ok) {
      alert('删除成功');
      loadImages(); // 刷新当前页
    } else {
      const err = await res.json().catch(() => ({ error: '未知错误' }));
      alert('删除失败：' + err.error);
    }
  }

  async function downloadImage(filename) {
    const token = localStorage.getItem('authToken');
    const res = await fetch(`/download/${encodeURIComponent(filename)}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.ok) {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    } else {
      alert('下载失败，请重新登录');
    }
  }
</script>

</body>
</html>
